name: Auditoria de segredos antes de publicar ZypherDesk
# Gitleaks: sha dos blobs e falsos positivos da auditoria vinculados aos commits.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditoria-publicacao.yml'

permissions:
  contents: read

jobs:
  secrets-history:
    name: Revisar segredos no historico Git
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Buscar historico completo e refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks - comparar achados com blobs originais
        shell: bash
        run: |
          set -uo pipefail
          set +e  # The scanner returns 1 when it finds potential matches.
          trap 'rm -f .gitleaks-audit-tmp.json' EXIT
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --redact --log-opts="--all" --log-level error \
              --report-format json --report-path /workspace/.gitleaks-audit-tmp.json /workspace
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "Erro executando Gitleaks, nao e possivel aprovar esta auditoria."
            exit 1
          fi
          python3 scripts/auditar_segredos.py .gitleaks-audit-tmp.json

      - name: Aviso sobre alcance da verificacao
        if: always()
        run: |
          echo "Gitleaks cobre padroes comuns, nao garante ausencia de segredos."
          echo "Revise tambem historico do GitHub Actions, artifacts e politicas de privacidade."
