name: Auditoria de segredos antes de publicar ZypherDesk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditoria-publicacao.yml'

permissions:
  contents: read

jobs:
  secrets-history:
    name: Revisar segredos no historico Git
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Buscar historico completo e refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks - vasculhar todos os commits sem mostrar valores
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --redact --log-opts="--all" --log-level warn /workspace
          echo "Triagem de segredos automatica concluida. Revise o historico, os logs e os falsos positivos manualmente antes de publicar."

      - name: Aviso sobre alcance da verificacao
        if: always()
        run: |
          echo "Gitleaks cobre padroes comuns, nao garante ausencia de segredos."
          echo "Revise tambem historico do GitHub Actions, artifacts e politicas de privacidade."
